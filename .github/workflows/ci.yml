name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test (Testcontainers PostgreSQL)
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee gradle-output.txt
      - name: Report failures as annotations
        if: failure()
        run: |
          # 컴파일 오류와 실패한 테스트를 Actions 화면의 오류 표시로 남김
          grep -E "error:|FAILED|Caused by|Exception" gradle-output.txt | grep -v "^\s*at " | head -10 | while IFS= read -r line; do
            echo "::error title=backend::${line}"
          done
          # 실패한 테스트의 단언 메시지 (테스트 결과 XML)
          grep -ho '<failure message="[^"]*' build/test-results/test/*.xml 2>/dev/null | sed 's/<failure message="//' | head -10 | while IFS= read -r line; do
            echo "::error title=assertion::${line:0:300}"
          done
          # 테스트 중 서버 로그에 남은 예외 (500 원인 확인용)
          grep -h -oE "[A-Za-z0-9_.$]+(Exception|Error): [^<&]{0,240}" build/test-results/test/*.xml 2>/dev/null | grep -v "AssertionError\|AssertionFailedError" | sort | uniq -c | sort -rn | head -10 | while IFS= read -r line; do
            echo "::error title=server-exception::${line:0:300}"
          done
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (real backend + DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: petroom
          POSTGRES_USER: petroom
          POSTGRES_PASSWORD: petroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petroom"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon
          JAR=$(ls build/libs/*.jar | grep -v plain)
          # 운영 프로필로 실행해 운영 설정(구조화 로그, 비밀키 검사)도 함께 확인
          SPRING_PROFILES_ACTIVE=prod JWT_SECRET="e2e-$(openssl rand -hex 32)" \
            CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            nohup java -jar "$JAR" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8080/actuator/health > /dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
          # 배포와 같은 standalone 실행 파일로 띄움
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3000 nohup node .next/standalone/server.js > "$RUNNER_TEMP/frontend.log" 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 30); do curl -sf localhost:3000/login > /dev/null && break; sleep 2; done
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Report server errors as annotations
        if: failure()
        run: |
          tail -c 20000 "$RUNNER_TEMP/backend.log" | grep -E "ERROR|Exception" | head -10 | while IFS= read -r line; do
            echo "::error title=backend-log::${line:0:300}"
          done
      - name: Check structured request logs
        run: |
          # 운영 로그가 JSON 한 줄 형식이고 요청 ID가 들어가는지 확인
          grep 'logger":"http"' "$RUNNER_TEMP/backend.log" | head -1 | tee /dev/stderr | grep -q '"requestId"'

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t pet-room-backend backend
      - name: Build frontend image
        run: docker build -t pet-room-frontend --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com frontend
      - name: Smoke test frontend image
        run: |
          docker run -d --name fe -p 3000:3000 pet-room-frontend
          for i in $(seq 20); do curl -sf localhost:3000/login > /dev/null && break; sleep 1; done
          curl -sf localhost:3000/login > /dev/null
          curl -sfI localhost:3000/sw.js | grep -i "cache-control: no-cache"
      - name: Backend image refuses to start without settings
        run: |
          # prod 프로필: DB·JWT_SECRET 없이 실행하면 멈춰야 함 (설정 누락을 배포 단계에서 바로 발견)
          set +e
          timeout 90 docker run --rm pet-room-backend > out.log 2>&1
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -ne 0 && test "$code" -ne 124
          grep -m1 -oE "JWT_SECRET[^\"]{0,80}|Connection to [^ ]+ refused" out.log || true
