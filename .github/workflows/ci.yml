name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test (Testcontainers PostgreSQL)
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee gradle-output.txt
      - name: Report failures as annotations
        if: failure()
        run: |
          # 컴파일 오류와 실패한 테스트를 Actions 화면의 오류 표시로 남김
          grep -E "error:|FAILED|Caused by|Exception" gradle-output.txt | grep -v "^\s*at " | head -10 | while IFS= read -r line; do
            echo "::error title=backend::${line}"
          done
          # 실패한 테스트의 단언 메시지 (테스트 결과 XML)
          grep -ho '<failure message="[^"]*' build/test-results/test/*.xml 2>/dev/null | sed 's/<failure message="//' | head -10 | while IFS= read -r line; do
            echo "::error title=assertion::${line:0:300}"
          done
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
