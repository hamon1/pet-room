services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petroom
      POSTGRES_USER: petroom
      POSTGRES_PASSWORD: petroom
    ports:
      - "5432:5432"
    volumes:
      - petroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petroom -d petroom"]
      interval: 5s
      retries: 10

volumes:
  petroom-db:
