spring:
  application:
    name: pet-room
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petroom}
    username: ${DB_USERNAME:petroom}
    password: ${DB_PASSWORD:petroom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: never
  shutdown: graceful

logging:
  pattern:
    # 로그 한 줄마다 요청 ID를 붙여 같은 요청의 로그를 묶어 볼 수 있게 합니다.
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 로컬 개발용 기본값. 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 값을 지정합니다.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes+}
    expires-in-seconds: ${JWT_EXPIRES_IN:1800}
    refresh-expires-in-seconds: ${JWT_REFRESH_EXPIRES_IN:1209600}
    issuer: pet-room
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth:
    # 프론트엔드의 소셜 로그인 콜백 주소. 여기 없는 주소로 온 인가 코드는 거절합니다.
    allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:3000/oauth/callback}
    # 키를 넣지 않으면 해당 소셜 로그인은 비활성화됩니다.
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  push:
    # 웹 푸시(VAPID) 키. 셋 중 하나라도 없으면 웹 푸시는 비활성화됩니다. 키 생성: docs/deploy.md
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:}
    # 매일 알림 시각 (한국 시간)
    cron: ${PUSH_CRON:0 0 9 * * *}
