spring:
  application:
    name: pet-room
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petroom}
    username: ${DB_USERNAME:petroom}
    password: ${DB_PASSWORD:petroom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 로컬 개발용 기본값. 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 값을 지정합니다.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes+}
    expires-in-seconds: ${JWT_EXPIRES_IN:86400}
    issuer: pet-room
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
